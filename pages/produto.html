
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#c91f32">

    <title>Produto — Lar &amp; Cia</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>

<body>

    <div class="announcement">
        OFERTAS PARA SUA CASA · FRETE GRÁTIS A PARTIR DE R$ 199
    </div>

    <header class="site-header">
        <div class="header-inner">

            <a class="brand" href="index.html">
                <span class="brand-mark">L</span>lar<span>&amp;cia</span>
            </a>

            <button
                class="mobile-menu"
                type="button"
                aria-label="Abrir menu"
                aria-expanded="false">
                ☰
            </button>

            <nav class="main-nav">
                <a href="index.html">Início</a>
                <a href="produtos.html" aria-current="page">Produtos</a>
                <a href="produtos.html?categoria=cozinha">Cozinha</a>
                <a href="produtos.html?categoria=organizacao">Organização</a>
            </nav>

            <div class="header-actions">

                <a class="cart-link" href="carrinho.html">
                    ♧ Carrinho
                    <span class="cart-count" data-cart-count>0</span>
                </a>

            </div>
        </div>
    </header>

    <main class="page-shell">

        <div class="detail-layout" id="product-detail"></div>

        <section
            class="section"
            style="margin: 70px auto 0; width: 100%;">

            <div class="section-heading">

                <div>
                    <span class="eyebrow">Complete sua compra</span>
                    <h2>Você também pode gostar</h2>
                </div>

                <a class="text-link" href="produtos.html">
                    Ver catálogo →
                </a>

            </div>

            <div class="products" id="products"></div>

        </section>

    </main>

    <footer class="site-footer">

        <a class="brand" href="index.html">
            <span class="brand-mark">L</span>lar<span>&amp;cia</span>
        </a>

        <span>© 2026 Lar &amp; Cia · Loja demonstrativa</span>

        <div class="footer-links">
            <a href="produtos.html">Produtos</a>
            <a href="carrinho.html">Carrinho</a>
        </div>

    </footer>

    <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite">
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const p = new URLSearchParams(location.search).get('id');

            const related = PRODUCTS
                .filter(x => x.id !== p)
                .slice(0, 4);

            renderProducts('#products', related);
        });
    </script>

</body>

</html>
