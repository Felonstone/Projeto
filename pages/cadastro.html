                </a>
                <a class="cart-link" href="carrinho.html">♧ Carrinho <span class="cart-count" data-cart-count>0</span></a></div></header><main class="page-shell"><div class="form-card"><span class="eyebrow">Bem-vindo</span><h1 style="font:normal 34px Georgia,serif">Criar sua conta</h1><p class="small-note">Modelo visual de cadastro. Para uso real, implemente validação segura no servidor.</p><form id="demo-form"><div class="form-grid"><div class="field full"><label for="nome">Nome completo</label><input id="nome" autocomplete="name" required></div><div class="field full"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="confirmar">Confirmar senha</label><input id="confirmar" type="password" minlength="8" required></div></div><div class="form-actions"><button class="button" type="submit">Cadastrar (demonstração)</button><a class="button button-outline" href="login.html">Já tenho conta</a></div></form></div></main><footer class="site-footer"><a class="brand" href="index.html"><span class="brand-mark">L</span>lar<span>&amp;cia</span></a><span>© 2026 Lar &amp; Cia · Loja demonstrativa</span></footer><div class="toast" id="toast" role="status" aria-live="polite"></div><script>document.querySelector('#demo-form').addEventListener('submit',e=>{e.preventDefault();if(document.querySelector('#senha').value!==document.querySelector('#confirmar').value){notify('As senhas não coincidem.');return;}notify('Cadastro demonstrativo: conecte um back-end para ativar esta função.');});</script></body></html>
