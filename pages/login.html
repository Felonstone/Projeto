
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Entrar — Lar &amp; Cia</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>

<body>

    <div class="announcement">
        LAR &amp; CIA · PRODUTOS PARA SUA CASA
    </div>

    <header class="site-header">
        <div class="header-inner">

            <a class="brand" href="index.html">
                <span class="brand-mark">L</span>lar<span>&amp;cia</span>
            </a>

            <a class="cart-link" href="carrinho.html">
                ♧ Carrinho
                <span class="cart-count" data-cart-count>0</span>
            </a>

        </div>
    </header>

    <main class="page-shell">

        <div class="form-card">

            <span class="eyebrow">Área do cliente</span>

            <h1 style="font: normal 34px Georgia, serif">
                Entrar na sua conta
            </h1>

            <p class="small-note">
                Página ilustrativa. A autenticação ainda não está conectada
                a um servidor.
            </p>

            <div class="notice">
                Este formulário não valida usuários reais nem envia suas informações.
            </div>

            <form id="demo-form">

                <div class="form-grid">

                    <div class="field full">
                        <label for="email">E-mail</label>

                        <input
                            id="email"
                            type="email"
                            autocomplete="email"
                            required
                            placeholder="voce@email.com">
                    </div>

                    <div class="field full">
                        <label for="senha">Senha</label>

                        <input
                            id="senha"
                            type="password"
                            autocomplete="current-password"
                            required
                            placeholder="Sua senha">
                    </div>

                </div>

                <div class="form-actions">

                    <button class="button" type="submit">
                        Entrar (demonstração)
                    </button>

                    <a class="button button-outline" href="cadastro.html">
                        Criar conta
                    </a>

                </div>

            </form>

        </div>

    </main>

    <footer class="site-footer">

        <a class="brand" href="index.html">
            <span class="brand-mark">L</span>lar<span>&amp;cia</span>
        </a>

        <span>© 2026 Lar &amp; Cia · Loja demonstrativa</span>

    </footer>

    <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite">
    </div>

    <script>
        document.querySelector('#demo-form').addEventListener('submit', e => {
            e.preventDefault();

            notify(
                'Login demonstrativo: conecte um back-end para ativar esta função.'
            );
        });
    </script>

</body>

</html>
